services:
  postgres:
    image: postgres:16-alpine
    container_name: p2pguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: p2pguard
      POSTGRES_PASSWORD: p2pguard
      POSTGRES_DB: p2pguard
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2pguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
